# edison-revival overrides, applied after x86_64_defconfig and fragments/edison-fw/*.cfg.
#
# Our U-Boot loads only vmlinuz (no initramfs) and mounts root=PARTUUID=... ext4 on the
# eMMC, so everything needed to reach the root filesystem and the console is built in.

CONFIG_LOCALVERSION="-edison"

# eMMC (sdhci-pci 0x1190) and the root filesystem
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_MMC_SDHCI_ACPI=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y

# Console on ttyS2 (8250_mid + HSU DMA)
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_PCI=y
CONFIG_SERIAL_8250_MID=y
CONFIG_HSU_DMA=y

# The Merrifield watchdog; U-Boot starts it with a 60 s timeout
CONFIG_WATCHDOG=y
CONFIG_INTEL_MID_WATCHDOG=y

# USB device mode: dwc3 + configfs gadget (ethernet + serial for headless access)
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_DUAL_ROLE=y
CONFIG_USB_DWC3_PCI=y
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=m
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_EEM=y
CONFIG_USB_CONFIGFS_ACM=y

# ACPI table overlays at runtime (e.g. the DS2 LED SSDT) via configfs
CONFIG_ACPI_CONFIGFS=y

# WiFi / Bluetooth
CONFIG_CFG80211=m
CONFIG_RFKILL=y

# What Debian's systemd expects
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_AUTOFS_FS=y
CONFIG_FHANDLE=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_SECCOMP=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# x86_64_defconfig builds in SELinux, but Debian ships no policy, so systemd just logs
# "Could not open policy file" at boot.
# CONFIG_SECURITY_SELINUX is not set

# Debug options the edison-fw fragments switch on, which we don't want in a release
# CONFIG_REGULATOR_DEBUG is not set
# CONFIG_BRCMDBG is not set
