version: 2
updates:
  # Workflow actions are pinned to commit SHAs (immutable releases to their exact tag).
  # Dependabot keeps them current: one grouped pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
