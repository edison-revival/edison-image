name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml builds tags through this workflow

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version stamped into the image (git describe)

      - name: Restore Debian package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/cache
          key: debs-${{ hashFiles('rootfs/packages.txt') }}-${{ github.run_id }}
          restore-keys: debs-${{ hashFiles('rootfs/packages.txt') }}-

      - name: Build U-Boot, kernel and rootfs
        run: scripts/build.sh

      - name: Make build output readable for caching
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Package
        run: |
          mkdir dist
          cp out/uboot/u-boot.bin out/image/boot.vfat out/image/u-boot-env.bin dist/
          xz -T0 -6 -c out/image/rootfs.ext4 > dist/rootfs.ext4.xz
          cp out/kernel/config dist/kernel.config
          cp out/image/KERNEL_RELEASE dist/
          cp out/image/edison-image-release dist/
          cp out/uboot/VERSION dist/UBOOT_VERSION
          cp out/image/packages.manifest dist/
          cp scripts/flash.py dist/
          (cd dist && sha256sum u-boot.bin boot.vfat u-boot-env.bin rootfs.ext4.xz > SHA256SUMS)
          ls -l dist
          {
            echo "### Build"
            echo '```'
            cat dist/edison-image-release
            echo "UBOOT=$(cat dist/UBOOT_VERSION)"
            echo
            ls -lh dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edison-image-${{ github.sha }}
          path: dist/
          retention-days: 7
          compression-level: 0 # rootfs is already xz-compressed
