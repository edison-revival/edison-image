name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore Debian package cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: debs-${{ hashFiles('rootfs/packages.txt') }}-${{ github.run_id }}
          restore-keys: debs-${{ hashFiles('rootfs/packages.txt') }}-

      - name: Build U-Boot, kernel and rootfs
        run: scripts/build.sh

      - name: Make build output readable for caching
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Package
        run: |
          mkdir dist
          cp out/uboot/u-boot.bin out/image/boot.vfat out/image/u-boot-env.bin dist/
          xz -T0 -6 -c out/image/rootfs.ext4 > dist/rootfs.ext4.xz
          cp out/kernel/config dist/kernel.config
          cp out/image/KERNEL_RELEASE dist/
          cp out/uboot/VERSION dist/UBOOT_VERSION
          cp out/image/packages.manifest dist/
          cp scripts/flash.py dist/
          (cd dist && sha256sum u-boot.bin boot.vfat u-boot-env.bin rootfs.ext4.xz > SHA256SUMS)
          ls -l dist
          {
            echo "### Build"
            echo "- kernel: $(cat dist/KERNEL_RELEASE)"
            echo "- U-Boot: $(cat dist/UBOOT_VERSION)"
            echo '```'
            ls -lh dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: edison-image-${{ github.sha }}
          path: dist/
          retention-days: 7
          compression-level: 0 # rootfs is already xz-compressed

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "edison-image $GITHUB_REF_NAME" \
            --notes "Debian 13 for the Intel Edison. Kernel $(cat dist/KERNEL_RELEASE), U-Boot $(cat dist/UBOOT_VERSION). Flash with: uv run flash.py --images ."
