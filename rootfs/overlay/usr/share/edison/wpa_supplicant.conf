# WiFi networks for wpa_supplicant@wlan0. This file lives on the config partition
# (/var/lib/edison/wifi/), so it survives reflashing; /etc/wpa_supplicant/
# wpa_supplicant-wlan0.conf points here.
#
# Add a network with:
#   sudo sh -c 'wpa_passphrase "MyNetwork" >> /etc/wpa_supplicant/wpa_supplicant-wlan0.conf'
#   sudo systemctl restart wpa_supplicant@wlan0
# or use wpa_cli (changes are saved with save_config).
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=1
