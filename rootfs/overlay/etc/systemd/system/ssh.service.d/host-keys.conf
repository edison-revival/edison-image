# SSH host keys live on the config partition, so a board keeps its SSH identity across
# reflashes (no "host key changed" warnings). They're created on first start. Debian's
# unit runs `sshd -t` first, which fails without keys, so reset ExecStartPre: create the
# keys (a no-op once they exist), then check the config.
[Unit]
RequiresMountsFor=/var/lib/edison

[Service]
ExecStartPre=
ExecStartPre=/bin/mkdir -p /var/lib/edison/ssh/etc/ssh
ExecStartPre=/usr/bin/ssh-keygen -A -f /var/lib/edison/ssh
ExecStartPre=/usr/sbin/sshd -t
