# Keep the WiFi config on the config partition so it survives reflashing. wpa_supplicant
# rewrites its config by replacing the file, so point -c at the real file rather than
# relying on the /etc symlink.
[Unit]
RequiresMountsFor=/var/lib/edison

[Service]
ExecStartPre=/usr/local/sbin/edison-config wifi %I
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/var/lib/edison/wifi/wpa_supplicant-%I.conf -i%I
