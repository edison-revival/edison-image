# U-Boot arms the Merrifield SCU watchdog; systemd keeps servicing it.
#
# The intel-mid_wdt driver panics at (timeout - 15 s) and has no set_timeout, so a timeout
# changed while the watchdog runs isn't applied to the hardware; only systemd's keepalive
# pace changes. Keep both values equal: 60 s gives a warning at 45 s against keepalives
# every 30 s, during runtime and during shutdown. (30 s left no margin; a different
# RebootWatchdogSec panicked the board mid-shutdown.)
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=60s
